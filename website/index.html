<!DOCTYPE html>
<html lang="zh-CN" data-release-json="./releases.json">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>m0m.app — 给日常的温柔小软件</title>
  <meta name="description" content="给日常的温柔小软件，少一点折腾。原生顺手、专注克制、留在本地。" />
  <meta name="theme-color" content="#fafafa" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <script>
    try {
      const t = localStorage.getItem('site-theme-mode');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar band">
      <a class="brand-link" href="./">
        <span class="brand-mark" aria-hidden="true">m</span>
        <span class="brand-name">m0m<span class="muted">.app</span></span>
      </a>
      <nav class="nav-actions" aria-label="主导航">
        <a class="nav-btn" href="./huaben/">话本本</a>
        <button type="button" class="nav-btn nav-btn-icon" data-theme-toggle aria-label="切换亮色或暗色主题" aria-pressed="false">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </nav>
    </header>

    <main>
      <section class="hero band">
        <h1 class="hero-display">
          <span class="hero-line">给日常的<span class="hero-emphasis">温柔</span>小软件</span>
          <span class="hero-line">少一点<del class="hero-strike">折腾</del></span>
        </h1>
      </section>

      <section class="grid-3 band" aria-label="设计原则">
        <article class="cell">
          <h2 class="cell-title">原生顺手</h2>
          <p class="cell-body">打开就能用，不弹窗，不打扰。</p>
        </article>
        <article class="cell">
          <h2 class="cell-title">专注克制</h2>
          <p class="cell-body">一款应用只做一件小事，没有广告和榜单。</p>
        </article>
        <article class="cell">
          <h2 class="cell-title">留在本地</h2>
          <p class="cell-body">作品和录音都在设备里，随时完整带走。</p>
        </article>
      </section>

      <section id="apps" class="band" aria-label="产品">
        <div class="app-row">
          <img class="app-icon" src="./assets/app-icon.png" alt="话本本应用图标" width="56" height="56" />
          <div class="app-row-body">
            <div class="app-row-head">
              <h3 class="app-row-title">话本本</h3>
              <span class="tag">儿童语音绘本</span>
              <span class="tag tag-brand mono" data-release-version>v1.2.0</span>
            </div>
            <p class="app-row-desc">孩子开口讲故事，平板和手机当场变成带拼音的有声绘本。支持 Android 与 macOS。</p>
            <div class="app-row-actions">
              <a class="btn btn-sm btn-muted" href="./huaben/">
                <span>官网</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
              </a>
              <a class="btn btn-sm btn-primary" data-release-apk href="https://cnb.cool/lzb-prod/story-note-releases/-/git/raw/main/apk/StoryNote-latest.apk">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                <span>下载 APK</span>
              </a>
              <div class="qr-popover-wrap" data-qr-wrap>
                <button type="button" class="btn btn-sm btn-outline" data-qr-trigger aria-expanded="false">扫码安装</button>
                <div class="qr-popover" role="dialog" aria-label="扫码下载二维码">
                  <div class="qr-popover-box">
                    <img src="./assets/qr-apk.png" alt="扫码下载话本本 APK" width="128" height="128" />
                  </div>
                  <p class="qr-popover-hint">手机扫码直连下载 APK</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="footer-wordmark" aria-hidden="true">
      <svg data-wordmark-svg viewBox="0 0 560 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wm-fill" x1="280" y1="12" x2="280" y2="142" gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--footer-stroke)" stop-opacity="0.02" />
            <stop offset="1" stop-color="var(--footer-stroke)" stop-opacity="0.18" />
          </linearGradient>
          <linearGradient id="wm-glow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="40%" stop-color="#ef4444" />
            <stop offset="75%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
          <filter id="wm-blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="24" />
          </filter>
          <mask id="wm-mask">
            <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="104" font-weight="800" letter-spacing="8" text-anchor="middle" stroke="#ffffff" stroke-width="1.6" fill="none" opacity="0.85">
              <text x="274" y="114">M0M.APP</text>
              <text x="280" y="120">M0M.APP</text>
            </g>
          </mask>
        </defs>
        <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="104" font-weight="800" letter-spacing="8" text-anchor="middle">
          <text x="274" y="114" fill="none" stroke="var(--footer-stroke)" stroke-opacity="0.22" stroke-width="1">M0M.APP</text>
          <text x="280" y="120" fill="url(#wm-fill)" stroke="var(--footer-stroke)" stroke-opacity="0.45" stroke-width="1">M0M.APP</text>
        </g>
        <g mask="url(#wm-mask)">
          <circle id="glow-circle" cx="280" cy="84" r="95" fill="url(#wm-glow)" filter="url(#wm-blur)" />
        </g>
      </svg>
    </div>

    <footer class="footer-bar">
      <span>© 2026 m0m.app</span>
      <div class="footer-links">
        <a href="./huaben/">话本本</a>
      </div>
    </footer>
  </div>
  <script src="./site.js"></script>
</body>
</html>
